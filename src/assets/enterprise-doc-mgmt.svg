<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradients and styles -->
  <defs>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sharepointGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16A085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#138D75;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="900" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="700" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50" text-anchor="middle">
    Document Management Pipeline Architecture
  </text>
  
  <!-- Source Systems (Left) -->
  <g id="sources">
    <text x="70" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#34495E">
      Source Systems
    </text>
    
    <!-- Customer Portal -->
    <rect x="30" y="120" width="180" height="100" rx="8" fill="url(#appGrad)" filter="url(#shadow)"/>
    <text x="120" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      Customer Portal
    </text>
    <text x="120" y="180" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      • Service Requests
    </text>
    <text x="120" y="200" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      • Uploaded Images
    </text>
    
    <!-- Legacy Systems -->
    <rect x="30" y="250" width="180" height="100" rx="8" fill="url(#appGrad)" filter="url(#shadow)"/>
    <text x="120" y="285" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      Legacy Systems
    </text>
    <text x="120" y="310" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      • Customer Bills
    </text>
    <text x="120" y="330" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      • Billing Documents
    </text>
  </g>
  
  <!-- RedHat Linux Server -->
  <g id="redhat-server">
    <rect x="320" y="120" width="220" height="230" rx="8" fill="url(#serverGrad)" filter="url(#shadow)"/>
    <text x="430" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      RedHat Linux Server
    </text>
    
    <!-- Bash Script Box -->
    <rect x="340" y="170" width="180" height="160" rx="5" fill="#34495E" opacity="0.3"/>
    <text x="430" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
      Bash Script
    </text>
    <text x="430" y="220" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      1. Aggregate documents
    </text>
    <text x="430" y="240" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      2. Zip files
    </text>
    <text x="430" y="260" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      3. Transfer to Windows
    </text>
    <text x="430" y="280" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      4. Batched processing
    </text>
    
    <!-- Jenkins Icon -->
    <circle cx="430" cy="310" r="12" fill="#D33833"/>
    <text x="430" y="316" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">J</text>
    <text x="465" y="315" font-family="Arial, sans-serif" font-size="11" fill="white">Jenkins</text>
  </g>
  
  <!-- Arrow 1: Sources to RedHat -->
  <path d="M 210 170 L 320 200" stroke="#7F8C8D" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 210 300 L 320 250" stroke="#7F8C8D" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow 2: RedHat to Windows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7F8C8D" />
    </marker>
  </defs>
  <path d="M 540 235 L 640 235" stroke="#7F8C8D" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="590" y="225" font-family="Arial, sans-serif" font-size="12" fill="#34495E" text-anchor="middle">
    File Transfer
  </text>
  
  <!-- Windows Server -->
  <g id="windows-server">
    <rect x="640" y="120" width="240" height="230" rx="8" fill="url(#windowsGrad)" filter="url(#shadow)"/>
    <text x="760" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      Windows Server
    </text>
    
    <!-- PowerShell Box -->
    <rect x="660" y="170" width="200" height="160" rx="5" fill="#34495E" opacity="0.3"/>
    <text x="760" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
      PowerShell Script
    </text>
    <text x="760" y="220" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • Multi-parallel processing
    </text>
    <text x="760" y="240" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • Error handling
    </text>
    <text x="760" y="260" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • Resumption capability
    </text>
    <text x="760" y="280" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • Cleanup operations
    </text>
    <text x="760" y="300" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • Bulk processing
    </text>
    <text x="760" y="320" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • Write URLs to DB
    </text>
  </g>
  
  <!-- Arrow 3: Windows to SharePoint -->
  <path d="M 880 235 L 980 235" stroke="#7F8C8D" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="930" y="225" font-family="Arial, sans-serif" font-size="12" fill="#34495E" text-anchor="middle">
    Upload Files
  </text>
  
  <!-- Arrow 3b: SharePoint back to Windows (return URL) -->
  <path d="M 980 265 L 880 265" stroke="#16A085" stroke-width="3" fill="none" marker-end="url(#arrowhead2)" stroke-dasharray="5,5"/>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#16A085" />
    </marker>
  </defs>
  <text x="930" y="285" font-family="Arial, sans-serif" font-size="11" fill="#16A085" text-anchor="middle">
    Return File URLs
  </text>
  
  <!-- SharePoint -->
  <g id="sharepoint">
    <rect x="980" y="120" width="200" height="230" rx="8" fill="url(#sharepointGrad)" filter="url(#shadow)"/>
    <text x="1080" y="150" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      SharePoint
    </text>
    <text x="1080" y="175" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">
      SharePoint Online
    </text>
    
    <!-- Document Icons -->
    <g transform="translate(1010, 190)">
      <rect x="0" y="0" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
      <rect x="35" y="0" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
      <rect x="70" y="0" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
      <rect x="105" y="0" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
      <rect x="17.5" y="45" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
      <rect x="52.5" y="45" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
      <rect x="87.5" y="45" width="30" height="40" rx="3" fill="white" opacity="0.9"/>
    </g>
    
    <text x="1080" y="295" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      Centralized Storage
    </text>
    <text x="1080" y="320" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      Returns SharePoint Links
    </text>
  </g>
  
  <!-- Arrow 4: Windows to Database -->
  <path d="M 760 350 Q 760 450, 980 500" stroke="#3498DB" stroke-width="4" fill="none" marker-end="url(#arrowhead3)"/>
  <defs>
    <marker id="arrowhead3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498DB" />
    </marker>
  </defs>
  <text x="820" y="420" font-family="Arial, sans-serif" font-size="12" fill="#3498DB">
    Write URLs to DB
  </text>
  
  <!-- Database -->
  <g id="database">
    <ellipse cx="1080" cy="480" rx="100" ry="30" fill="url(#dbGrad)" filter="url(#shadow)"/>
    <rect x="980" y="480" width="200" height="80" fill="url(#dbGrad)"/>
    <ellipse cx="1080" cy="560" rx="100" ry="30" fill="#7D3C98"/>
    <ellipse cx="1080" cy="480" rx="100" ry="30" fill="url(#dbGrad)"/>
    
    <text x="1080" y="525" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      Database
    </text>
    <text x="1080" y="545" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      SharePoint Links
    </text>
  </g>
  
  <!-- Arrow 5: Database to Customer App -->
  <path d="M 980 520 L 580 650" stroke="#7F8C8D" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="780" y="570" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
    Link Retrieval
  </text>
  
  <!-- Customer Application -->
  <g id="customer-app">
    <rect x="380" y="620" width="200" height="120" rx="8" fill="url(#appGrad)" filter="url(#shadow)"/>
    <text x="480" y="655" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
      Customer Application
    </text>
    <text x="480" y="685" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">
      Document Viewing
    </text>
    <text x="480" y="710" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • Fast retrieval
    </text>
    <text x="480" y="727" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">
      • No manual management
    </text>
  </g>
  
  <!-- Benefits Box -->
  <g id="benefits">
    <rect x="30" y="620" width="280" height="120" rx="8" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="170" y="650" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50" text-anchor="middle">
      Key Benefits
    </text>
    <text x="40" y="675" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      ✓ Reduced document retrieval time
    </text>
    <text x="40" y="695" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      ✓ Eliminated manual file management
    </text>
    <text x="40" y="715" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      ✓ Automated multi-stage pipeline
    </text>
    <text x="40" y="735" font-family="Arial, sans-serif" font-size="12" fill="#34495E">
      ✓ Parallel processing optimization
    </text>
  </g>
  
  <!-- Technology Stack -->
  <g id="tech-stack">
    <rect x="1210" y="450" width="160" height="180" rx="8" fill="#34495E" filter="url(#shadow)"/>
    <text x="1290" y="480" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
      Tech Stack
    </text>
    
    <circle cx="1235" cy="510" r="8" fill="#E74C3C"/>
    <text x="1250" y="515" font-family="Arial, sans-serif" font-size="13" fill="white">Bash/Linux</text>
    
    <circle cx="1235" cy="540" r="8" fill="#3498DB"/>
    <text x="1250" y="545" font-family="Arial, sans-serif" font-size="13" fill="white">PowerShell</text>
    
    <circle cx="1235" cy="570" r="8" fill="#16A085"/>
    <text x="1250" y="575" font-family="Arial, sans-serif" font-size="13" fill="white">SharePoint API</text>
    
    <circle cx="1235" cy="600" r="8" fill="#D33833"/>
    <text x="1250" y="605" font-family="Arial, sans-serif" font-size="13" fill="white">Jenkins</text>
  </g>
  
  <!-- Processing Flow Label -->
  <text x="700" y="870" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" text-anchor="middle" font-style="italic">
    Automated Document Aggregation and Distribution Pipeline
  </text>
</svg>